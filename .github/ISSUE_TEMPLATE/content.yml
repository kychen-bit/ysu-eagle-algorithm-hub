name: 资料问题
description: 报告文章错误、失效链接或补充建议
title: "[资料] "
labels: [content]
body:
  - type: input
    id: page
    attributes:
      label: 页面链接
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与建议
      description: 请说明错误位置、复现环境或建议修改的内容。
    validations:
      required: true
